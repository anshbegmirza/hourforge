<ion-header class="ion-padding header">
  <ion-toolbar>
    <ion-title class="sub-header">{{ 'DELETE_WARNING' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="closeModal()"
        fill="clear"
        [attr.aria-label]="'ARIA_CLOSE' | translate"
      >
        <ion-icon name="close-outline" class="hf-dialog-close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding page-wrapper modal-content">
  <ion-label class="section-label">{{ msgToShow }}</ion-label>

  <div class="action-buttons">
    <ion-button color="primary" (click)="confirmDelete()" class="hf-dialog-btn">
      {{ 'LBL_YES' | translate }}
    </ion-button>
  </div>
</ion-content>
