<ion-header class="ion-padding header">
  <ion-toolbar class="header-toolbar">
    <ion-title class="title">
      {{ type | translate }}
      {{ 'SIGNATURE' | translate }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="closeModal()"
        fill="clear"
        [attr.aria-label]="'ARIA_CLOSE' | translate"
      >
        <ion-icon name="close-outline" class="hf-dialog-close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding page-wrapper modal-content">
  <canvas #signatureCanvas class="sign-canvas"></canvas>

  <div class="action-buttons">
    <ion-button
      (click)="removeSign()"
      expand="block"
      class="hf-dialog-btn"
      fill="clear"
      color="danger"
    >
      {{ 'CLEAR' | translate }}
    </ion-button>
    <ion-button
      expand="block"
      color="primary"
      class="hf-dialog-btn"
      (click)="sendData()"
      [disabled]="isCleared"
    >
      {{ 'SAVE' | translate }}
    </ion-button>
  </div>
</ion-content>
